# NOTE: For unified deployment, use the root docker-compose.yml instead.
# This file is kept for partial/standalone middleware deployments.
services:
  mysql:
    image: mysql:8.4
    container_name: semirisk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: semirisk
      MYSQL_USER: semirisk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - semirisk-mysql:/var/lib/mysql

  # NOTE: For full Redis cluster (1 master + 3 replicas), use the root docker-compose.yml.
  # This file keeps a single Redis for partial/standalone middleware deployments.
  redis:
    image: redis:7.4
    container_name: semirisk-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: semirisk-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: ${ES_SECURITY_ENABLED:"false"}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: semirisk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - semirisk-minio:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: semirisk-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Nacos 服务注册发现 + 配置中心
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: semirisk-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLED:"true"}
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"

  # Zipkin 分布式链路追踪
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: semirisk-zipkin
    ports:
      - "9411:9411"

volumes:
  semirisk-mysql:
  semirisk-minio:
