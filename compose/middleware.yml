services:
  mysql:
    image: mysql:8.4
    container_name: semirisk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: semirisk
      MYSQL_USER: semirisk
      MYSQL_PASSWORD: semirisk
    ports:
      - "3306:3306"
    volumes:
      - semirisk-mysql:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: semirisk-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: semirisk-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: semirisk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: semirisk
      MINIO_ROOT_PASSWORD: semirisk123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - semirisk-minio:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: semirisk-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  semirisk-mysql:
  semirisk-minio:

