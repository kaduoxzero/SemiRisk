# NOTE: For unified deployment, use the root docker-compose.yml instead.
# This file is kept for partial/standalone frontend deployments.
services:
  semirisk-ui:
    build:
      context: ../semirisk-ui
      dockerfile: Dockerfile
    image: semirisk/ui:latest
    ports:
      - "5173:80"
    depends_on:
      - semirisk-gateway
