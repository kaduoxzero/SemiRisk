<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>找回密码 - 供应链风险智能管理系统</title>
  <script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
  <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="common.css" rel="stylesheet"/>
  <script>
    tailwind.config = { theme: { extend: { colors: { 'cyber-bg': '#030712', 'cyber-card': '#0f172a', 'neon-blue': '#3b82f6' } } } }
  </script>
</head>
<body class="bg-cyber-bg text-foreground min-h-screen flex items-center justify-center overflow-hidden">
  <canvas id="particle-canvas"></canvas>
  <div class="fixed inset-0 pointer-events-none opacity-20">
    <svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern height="100" id="grid" patternunits="userSpaceOnUse" width="100">
          <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#3b82f6" stroke-width="0.5"></path>
        </pattern>
      </defs>
      <rect fill="url(#grid)" height="100%" width="100%"></rect>
    </svg>
  </div>
  <div class="relative z-10 w-full max-w-md px-6">
    <div class="hud-card p-8 space-y-8">
      <div class="corner-br"></div><div class="corner-bl"></div>
      <div class="text-center space-y-2">
        <div class="flex justify-center">
          <div class="w-16 h-16 rounded-2xl bg-warning/20 flex items-center justify-center border border-warning/50 shadow-[0_0_20px_rgba(234,179,8,0.4)]">
            <iconify-icon class="text-4xl text-warning" icon="lucide:key-round"></iconify-icon>
          </div>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white mt-4">系统凭证重置</h1>
        <p class="text-sm text-slate-400">请输入绑定的企业邮箱获取重置链接</p>
      </div>
      <form class="space-y-6" onsubmit="event.preventDefault(); showToast('重置链接已发送至您的邮箱', 'success'); setTimeout(() => window.location.href='index.html', 2000);">
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-sm font-medium text-slate-300 ml-1">企业邮箱</label>
            <div class="relative">
              <iconify-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" icon="lucide:mail"></iconify-icon>
              <input class="cyber-input w-full pl-10 pr-4 py-3 rounded-lg" placeholder="admin@risk.com" required type="email"/>
            </div>
          </div>
        </div>
        <button class="w-full bg-warning hover:bg-yellow-600 text-black font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(234,179,8,0.4)] transition-all flex items-center justify-center space-x-2" type="submit">
          <iconify-icon icon="lucide:send"></iconify-icon>
          <span>发送安全重置指令</span>
        </button>
        <div class="text-center mt-4">
          <a class="text-sm text-slate-400 hover:text-white transition-colors" href="index.html">返回安全登录</a>
        </div>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
<script src="semirisk-api.js"></script>
</body>
</html>
