# SemiRisk -- unified single-image deployment
# Usage:
#   docker compose up -d          # start all services
#   docker compose down           # stop all services
#   docker compose logs -f        # watch logs
#   docker compose ps             # check status
#
# Prerequisites on the target machine:
#   - Docker 24+ / Docker Compose v2
#   - Java 21 JDK + Maven (for building backend JARs)
#   - Node.js 22 LTS (for building frontend)
#   - At least 16 GB RAM recommended (6 Java services × 512MB + middleware)
#
# Environment variables (optional, set in .env or on command line):
#   MYSQL_ROOT_PASSWORD       - MySQL root password (REQUIRED)
#   MYSQL_PASSWORD            - MySQL app user password (REQUIRED)
#   SEMIRISK_AI_API_KEY       - DeepSeek API key (required for AI features)
#   SEMIRISK_AI_MODEL         - AI model name (default: deepseekv4-pro)
#   SEMIRISK_AI_ENDPOINT      - AI API endpoint (default: https://api.deepseek.com/v1)
#   SEMIRISK_FLYWAY_ENABLED   - Enable Flyway migrations (default: false)
#   MINIO_ROOT_PASSWORD       - MinIO admin password (REQUIRED)
#   MINIO_ROOT_USER           - MinIO admin username (REQUIRED)
#   RABBITMQ_USER             - RabbitMQ username (REQUIRED)
#   RABBITMQ_PASS             - RabbitMQ password (REQUIRED)
#   REDIS_CLUSTER_PASSWORD    - Redis AUTH password (optional, set to enable)

services:
  # ============================================================
  # Middleware Layer
  # ============================================================

  mysql:
    image: mysql:8.4
    container_name: semirisk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: semirisk
      MYSQL_USER: semirisk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - semirisk-mysql:/var/lib/mysql
      - ./compose/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis Cluster: 1 master + 3 replicas (slot-based sharding, auto failover)
  redis-master:
    image: redis:7.4
    container_name: semirisk-redis-master
    restart: unless-stopped
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes${REDIS_CLUSTER_PASSWORD:+ --requirepass ${REDIS_CLUSTER_PASSWORD} --masterauth ${REDIS_CLUSTER_PASSWORD}}
    ports:
      - "6379:6379"
    volumes:
      - semirisk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-1:
    image: redis:7.4
    container_name: semirisk-redis-replica-1
    restart: unless-stopped
    command: redis-server --port 6380 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --slaveof semirisk-redis-master 6379${REDIS_CLUSTER_PASSWORD:+ --requirepass ${REDIS_CLUSTER_PASSWORD} --masterauth ${REDIS_CLUSTER_PASSWORD}}
    ports:
      - "6380:6380"
    volumes:
      - semirisk-redis-data-1:/data
    depends_on:
      redis-master:
        condition: service_started
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-2:
    image: redis:7.4
    container_name: semirisk-redis-replica-2
    restart: unless-stopped
    command: redis-server --port 6381 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --slaveof semirisk-redis-master 6379${REDIS_CLUSTER_PASSWORD:+ --requirepass ${REDIS_CLUSTER_PASSWORD} --masterauth ${REDIS_CLUSTER_PASSWORD}}
    ports:
      - "6381:6381"
    volumes:
      - semirisk-redis-data-2:/data
    depends_on:
      redis-master:
        condition: service_started
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-3:
    image: redis:7.4
    container_name: semirisk-redis-replica-3
    restart: unless-stopped
    command: redis-server --port 6382 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --slaveof semirisk-redis-master 6379${REDIS_CLUSTER_PASSWORD:+ --requirepass ${REDIS_CLUSTER_PASSWORD} --masterauth ${REDIS_CLUSTER_PASSWORD}}
    ports:
      - "6382:6382"
    volumes:
      - semirisk-redis-data-3:/data
    depends_on:
      redis-master:
        condition: service_started
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cluster-init:
    image: redis:7.4
    container_name: semirisk-redis-cluster-init
    restart: "no"
    command: >
      bash -c "
        sleep 10 &&
        redis-cli -h semirisk-redis-master -p 6379 --cluster create \
          semirisk-redis-master:6379 \
          semirisk-redis-replica-1:6380 \
          semirisk-redis-replica-2:6381 \
          semirisk-redis-replica-3:6382 \
          --cluster-replicas 1 --cluster-yes
      "
    depends_on:
      redis-master:
        condition: service_started
      redis-replica-1:
        condition: service_started
      redis-replica-2:
        condition: service_started
      redis-replica-3:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: semirisk-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "${SEMIRISK_ES_SECURITY_ENABLED:false}"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - semirisk-es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: semirisk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - semirisk-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: semirisk-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: semirisk-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "${SEMIRISK_NACOS_AUTH_ENABLED:true}"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: semirisk-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9411/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # Application (single container with all 6 services + nginx)
  # ============================================================

  semirisk-app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.single
    image: semirisk/app:latest
    container_name: semirisk-app
    restart: unless-stopped
    environment:
      # --- Gateway (port 8080) ---
      SEMIRISK_PORT: 8080
      SEMIRISK_MIDDLEWARE_HOST: semirisk-mysql
      SEMIRISK_NACOS_HOST: semirisk-nacos
      SEMIRISK_REDIS_HOST: semirisk-redis
      SEMIRISK_ES_URL: http://semirisk-es:9200
      SEMIRISK_ES_INDEX: semirisk_knowledge
      SEMIRISK_FLYWAY_ENABLED: ${SEMIRISK_FLYWAY_ENABLED:-false}
      SEMIRISK_AUTH_TOKEN_TTL_MINUTES: ${SEMIRISK_AUTH_TOKEN_TTL_MINUTES:-15}
      SEMIRISK_AI_MODEL: ${SEMIRISK_AI_MODEL:-deepseekv4-pro}
      SEMIRISK_AI_ENDPOINT: ${SEMIRISK_AI_ENDPOINT:-https://api.deepseek.com/v1}
      SEMIRISK_AI_API_KEY: ${SEMIRISK_AI_API_KEY:-}
      SEMIRISK_MINIO_ENDPOINT: http://semirisk-minio:9000
      SEMIRISK_RABBITMQ_HOST: semirisk-rabbitmq
      # --- Data Service (port 8081) ---
      SEMIRISK_DATA_PORT: 8081
      SEMIRISK_CRAWLER_SOURCES: ${SEMIRISK_CRAWLER_SOURCES:-https://www.reuters.com/markets/commodities/,https://www.freightwaves.com/news}
      # --- Risk Service (port 8082) ---
      SEMIRISK_RISK_PORT: 8082
      SEMIRISK_DATA_SERVICE_URL: http://127.0.0.1:8081
      # --- AI Service (port 8083) ---
      SEMIRISK_AI_PORT: 8083
      SEMIRISK_RISK_SERVICE_URL: http://127.0.0.1:8082
      SEMIRISK_DATA_SERVICE_URL: http://127.0.0.1:8081
      # --- Alert Service (port 8084) ---
      SEMIRISK_ALERT_PORT: 8084
      SEMIRISK_DB_URL: jdbc:mysql://semirisk-mysql:3306/semirisk?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      # --- Report Service (port 8085) ---
      SEMIRISK_REPORT_PORT: 8085
    ports:
      - "80:80"        # Nginx (Vue frontend)
      - "8080:8080"    # Gateway (direct API access)
    depends_on:
      mysql:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ============================================================
# Named Volumes
# ============================================================

volumes:
  semirisk-mysql:
  semirisk-es:
  semirisk-minio:
  semirisk-redis-data:
  semirisk-redis-data-1:
  semirisk-redis-data-2:
  semirisk-redis-data-3:
