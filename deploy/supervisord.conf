[supervisord]
nodaemon=true
logfile=/var/log/supervisord/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
childlogdir=/app/logs
minfds=65535
minprocs=200

; ================================================================
; Nginx -- serves Vue 3 frontend on port 80
; ================================================================
[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
startsecs=2
startretries=3

; ================================================================
; Gateway -- port 8080 (central hub: auth, alerts, AI, files, dashboard)
; ================================================================
[program:gateway]
command=/usr/bin/java -jar -Xmx512m -Xms256m /app/semirisk-gateway.jar
autostart=true
autorestart=true
stdout_logfile=/app/logs/gateway.log
stderr_logfile=/app/logs/gateway-err.log
startsecs=15
startretries=5
environment=SEMIRISK_PORT="8080",SEMIRISK_MIDDLEWARE_HOST="127.0.0.1",SEMIRISK_NACOS_HOST="127.0.0.1"

; ================================================================
; Data Service -- port 8081 (RSS/Atom crawler)
; ================================================================
[program:data-service]
command=/usr/bin/java -jar -Xmx512m -Xms256m /app/semirisk-data-service.jar
autostart=true
autorestart=true
stdout_logfile=/app/logs/data-service.log
stderr_logfile=/app/logs/data-service-err.log
startsecs=15
startretries=5
environment=SEMIRISK_DATA_PORT="8081",SEMIRISK_MIDDLEWARE_HOST="127.0.0.1"

; ================================================================
; Risk Service -- port 8082 (risk calculation engine)
; ================================================================
[program:risk-service]
command=/usr/bin/java -jar -Xmx512m -Xms256m /app/semirisk-risk-service.jar
autostart=true
autorestart=true
stdout_logfile=/app/logs/risk-service.log
stderr_logfile=/app/logs/risk-service-err.log
startsecs=15
startretries=5
environment=SEMIRISK_RISK_PORT="8082",SEMIRISK_MIDDLEWARE_HOST="127.0.0.1"

; ================================================================
; AI Service -- port 8083 (AI API key management, report generation)
; ================================================================
[program:ai-service]
command=/usr/bin/java -jar -Xmx512m -Xms256m /app/semirisk-ai-service.jar
autostart=true
autorestart=true
stdout_logfile=/app/logs/ai-service.log
stderr_logfile=/app/logs/ai-service-err.log
startsecs=15
startretries=5
environment=SEMIRISK_AI_PORT="8083",SEMIRISK_MIDDLEWARE_HOST="127.0.0.1"

; ================================================================
; Alert Service -- port 8084 (alert processing, has MySQL datasource)
; ================================================================
[program:alert-service]
command=/usr/bin/java -jar -Xmx512m -Xms256m /app/semirisk-alert-service.jar
autostart=true
autorestart=true
stdout_logfile=/app/logs/alert-service.log
stderr_logfile=/app/logs/alert-service-err.log
startsecs=15
startretries=5
environment=SEMIRISK_ALERT_PORT="8084",SEMIRISK_MIDDLEWARE_HOST="127.0.0.1"

; ================================================================
; Report Service -- port 8085 (PDF report generation via OpenPDF)
; ================================================================
[program:report-service]
command=/usr/bin/java -jar -Xmx512m -Xms256m /app/semirisk-report-service.jar
autostart=true
autorestart=true
stdout_logfile=/app/logs/report-service.log
stderr_logfile=/app/logs/report-service-err.log
startsecs=15
startretries=5
environment=SEMIRISK_REPORT_PORT="8085",SEMIRISK_MIDDLEWARE_HOST="127.0.0.1"
