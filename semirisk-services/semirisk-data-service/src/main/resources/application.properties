spring.application.name=semirisk-data-service
server.port=${SEMIRISK_DATA_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics
management.health.discovery.enabled=false
spring.cloud.discovery.client.health-indicator.enabled=false
spring.cloud.discovery.client.composite-indicator.enabled=false

semirisk.crawler.sources=${SEMIRISK_CRAWLER_SOURCES:ChinaNewsFinance|https://www.chinanews.com.cn/rss/finance.xml|market;ChinaNewsWorld|https://www.chinanews.com.cn/rss/world.xml|global;ChinaNewsScroll|https://www.chinanews.com.cn/rss/scroll-news.xml|public_source;SupplyChainDive|https://www.supplychaindive.com/feeds/news/|supply_chain;FreightWaves|https://www.freightwaves.com/feed|logistics;TruckingDive|https://www.truckingdive.com/feeds/news/|logistics;ManufacturingDive|https://www.manufacturingdive.com/feeds/news/|manufacturing;FederalRegisterExportControl|https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=export+control|policy;WTOUpdates|https://www.wto.org/library/rss/latest_news_e.xml|policy}
semirisk.middleware.host=${SEMIRISK_MIDDLEWARE_HOST:192.168.101.130}

# ── Nacos 服务注册发现 ──────────────────────────────────────────────
spring.cloud.nacos.discovery.server-addr=${SEMIRISK_NACOS_HOST:192.168.101.130}:8848
spring.cloud.nacos.discovery.namespace=${SEMIRISK_NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${SEMIRISK_NACOS_GROUP:SEMIRISK}
spring.cloud.nacos.discovery.heart-beat-interval=5000
spring.cloud.nacos.discovery.username=${SEMIRISK_NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${SEMIRISK_NACOS_PASSWORD:}
spring.cloud.nacos.discovery.ip=${HOSTNAME:}
spring.cloud.nacos.discovery.register-enabled=true
spring.cloud.nacos.discovery.enabled=${SEMIRISK_NACOS_ENABLED:true}
spring.cloud.nacos.discovery.fail-fast=false

# ── Nacos 配置中心 ──────────────────────────────────────────────────
spring.cloud.nacos.config.server-addr=${SEMIRISK_NACOS_HOST:192.168.101.130}:8848
spring.cloud.nacos.config.namespace=${SEMIRISK_NACOS_NAMESPACE:public}
spring.cloud.nacos.config.group=${SEMIRISK_NACOS_GROUP:SEMIRISK}
spring.cloud.nacos.config.username=${SEMIRISK_NACOS_USERNAME:}
spring.cloud.nacos.config.password=${SEMIRISK_NACOS_PASSWORD:}
spring.cloud.nacos.config.file-extension=properties
spring.config.import=optional:nacos:${spring.application.name}.properties?group=SEMIRISK

# ── Zipkin 分布式链路追踪 ───────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${SEMIRISK_ZIPKIN_HOST:192.168.101.130}:9411/api/v2/spans

spring.cloud.compatibility-verifier.enabled=false

# Sentinel 流控/熔断 - 连接 Sentinel Dashboard
spring.cloud.sentinel.transport.dashboard=${SEMIRISK_SENTINEL_DASHBOARD:}
spring.cloud.sentinel.transport.port=8719
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.web-context-unify=false
feign.sentinel.enabled=true
