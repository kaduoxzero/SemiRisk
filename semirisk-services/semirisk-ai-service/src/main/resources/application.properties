spring.application.name=semirisk-ai-service
server.port=${SEMIRISK_AI_PORT:8083}
semirisk.risk-service.url=${SEMIRISK_RISK_SERVICE_URL:http://localhost:8082}
semirisk.ai.default.model=${SEMIRISK_AI_MODEL:deepseekv4-pro}
semirisk.ai.default.endpoint=${SEMIRISK_AI_ENDPOINT:https://api.deepseek.com/v1}
semirisk.ai.default.api-key=${SEMIRISK_AI_API_KEY:}
management.endpoints.web.exposure.include=health,info,metrics
