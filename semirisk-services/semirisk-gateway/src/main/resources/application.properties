spring.application.name=SemiRisk
server.port=${SEMIRISK_PORT:8080}
semirisk.auth.token-ttl-minutes=${SEMIRISK_AUTH_TOKEN_TTL_MINUTES:30}
semirisk.bootstrap.admin.enabled=${SEMIRISK_BOOTSTRAP_ADMIN_ENABLED:true}
semirisk.bootstrap.admin.username=${SEMIRISK_BOOTSTRAP_ADMIN_USERNAME:kaduoxli}
semirisk.bootstrap.admin.password=${SEMIRISK_BOOTSTRAP_ADMIN_PASSWORD:123qwe123}
semirisk.bootstrap.admin.display-name=${SEMIRISK_BOOTSTRAP_ADMIN_DISPLAY_NAME:kaduoxli}
semirisk.bootstrap.admin.email=${SEMIRISK_BOOTSTRAP_ADMIN_EMAIL:600000002@qq.com}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.web.resources.static-locations=file:../../semirisk-ui/dist/,classpath:/static/

# All shared middleware is addressed through the required VM IP.
semirisk.middleware.host=${SEMIRISK_MIDDLEWARE_HOST:192.168.101.130}
spring.data.redis.host=${SEMIRISK_REDIS_HOST:${semirisk.middleware.host}}
spring.data.redis.port=${SEMIRISK_REDIS_PORT:6379}
spring.data.redis.timeout=1500ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms
semirisk.elasticsearch.url=${SEMIRISK_ES_URL:http://${semirisk.middleware.host}:9200}
semirisk.elasticsearch.index=${SEMIRISK_ES_INDEX:semirisk_knowledge}

# MinIO 对象存储（上传文件 / 知识库文档真实落库与预览）
semirisk.minio.endpoint=${SEMIRISK_MINIO_ENDPOINT:http://${semirisk.middleware.host}:9000}
semirisk.minio.api-port=${SEMIRISK_MINIO_PORT:9000}
semirisk.minio.access-key=${SEMIRISK_MINIO_ACCESS_KEY:semirisk}
semirisk.minio.secret-key=${SEMIRISK_MINIO_SECRET_KEY:semirisk123}
semirisk.minio.bucket=${SEMIRISK_MINIO_BUCKET:semirisk}
semirisk.rabbitmq.http-port=${SEMIRISK_RABBITMQ_HTTP_PORT:15672}
semirisk.nacos.port=${SEMIRISK_NACOS_PORT:8848}

spring.datasource.url=${SEMIRISK_DB_URL:jdbc:mysql://${semirisk.middleware.host}:3306/semirisk?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SEMIRISK_DB_USERNAME:semirisk}
spring.datasource.password=${SEMIRISK_DB_PASSWORD:semirisk}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=5000

spring.flyway.enabled=${SEMIRISK_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

semirisk.data-service.url=${SEMIRISK_DATA_SERVICE_URL:http://localhost:8081}
semirisk.ai.default.model=${SEMIRISK_AI_MODEL:deepseekv4-pro}
semirisk.ai.default.endpoint=${SEMIRISK_AI_ENDPOINT:https://api.deepseek.com/v1}
semirisk.ai.default.api-key=${SEMIRISK_AI_API_KEY:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.pattern.level=%5p [traceId:%X{traceId:-}]
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.db.enabled=${SEMIRISK_HEALTH_DB_ENABLED:false}
management.health.redis.enabled=${SEMIRISK_HEALTH_REDIS_ENABLED:false}

# ── Nacos 服务注册发现 ──────────────────────────────────────────────
spring.cloud.nacos.discovery.server-addr=${SEMIRISK_NACOS_HOST:${semirisk.middleware.host}}:8848
spring.cloud.nacos.discovery.namespace=${SEMIRISK_NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${SEMIRISK_NACOS_GROUP:SEMIRISK}
spring.cloud.nacos.discovery.heart-beat-interval=5000
spring.cloud.nacos.discovery.ip=127.0.0.1
spring.cloud.nacos.discovery.register-enabled=true

# ── Nacos 配置中心 ──────────────────────────────────────────────────
spring.cloud.nacos.config.server-addr=${SEMIRISK_NACOS_HOST:${semirisk.middleware.host}}:8848
spring.cloud.nacos.config.namespace=${SEMIRISK_NACOS_NAMESPACE:public}
spring.cloud.nacos.config.group=${SEMIRISK_NACOS_GROUP:SEMIRISK}
spring.cloud.nacos.config.file-extension=properties
spring.config.import=optional:nacos:${spring.application.name}.properties?group=SEMIRISK

# ── Zipkin 分布式链路追踪 ───────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${semirisk.middleware.host}:9411/api/v2/spans

# ── Sentinel 熔断降级 ────────────────────────────────────────────────
feign.sentinel.enabled=true
spring.cloud.sentinel.transport.dashboard=${SEMIRISK_SENTINEL_DASHBOARD:}
spring.cloud.sentinel.eager=true

spring.cloud.compatibility-verifier.enabled=false
