spring.application.name=SemiRisk
server.port=${SEMIRISK_PORT:8080}
semirisk.auth.token-ttl-minutes=${SEMIRISK_AUTH_TOKEN_TTL_MINUTES:30}
semirisk.bootstrap.admin.enabled=${SEMIRISK_BOOTSTRAP_ADMIN_ENABLED:true}
semirisk.bootstrap.admin.username=${SEMIRISK_BOOTSTRAP_ADMIN_USERNAME:}
semirisk.bootstrap.admin.password=${SEMIRISK_BOOTSTRAP_ADMIN_PASSWORD:}
semirisk.bootstrap.admin.display-name=${SEMIRISK_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
semirisk.bootstrap.admin.email=${SEMIRISK_BOOTSTRAP_ADMIN_EMAIL:}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.web.resources.static-locations=classpath:/static/

# All shared middleware is addressed through the required VM IP.
semirisk.middleware.host=${SEMIRISK_MIDDLEWARE_HOST:}
# Redis Cluster: 1 master + 3 replicas (slot-based sharding, auto failover)
semirisk.redis.cluster.nodes=${SEMIRISK_REDIS_NODES:}
semirisk.redis.cluster.password=${SEMIRISK_REDIS_PASSWORD:}
semirisk.redis.cluster.max-redirects=3
spring.data.redis.cluster.nodes=${semirisk.redis.cluster.nodes}
spring.data.redis.cluster.password=${semirisk.redis.cluster.password}
spring.data.redis.cluster.max-redirects=${semirisk.redis.cluster.max-redirects:3}
spring.data.redis.timeout=1500ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3000ms
semirisk.elasticsearch.url=${SEMIRISK_ES_URL:http://${semirisk.middleware.host}:9200}
semirisk.elasticsearch.index=${SEMIRISK_ES_INDEX:semirisk_knowledge}

# MinIO 对象存储（上传文件 / 知识库文档真实落库与预览）
semirisk.minio.endpoint=${SEMIRISK_MINIO_ENDPOINT:http://${semirisk.middleware.host}:9000}
semirisk.minio.api-port=${SEMIRISK_MINIO_PORT:9000}
semirisk.minio.access-key=${SEMIRISK_MINIO_ACCESS_KEY:}
semirisk.minio.secret-key=${SEMIRISK_MINIO_SECRET_KEY:}
semirisk.minio.bucket=${SEMIRISK_MINIO_BUCKET:semirisk}
spring.rabbitmq.host=${SEMIRISK_MIDDLEWARE_HOST:}
spring.rabbitmq.port=${SEMIRISK_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SEMIRISK_RABBITMQ_USER:}
spring.rabbitmq.password=${SEMIRISK_RABBITMQ_PASS:}
semirisk.rabbitmq.http-port=${SEMIRISK_RABBITMQ_HTTP_PORT:15672}
semirisk.nacos.port=${SEMIRISK_NACOS_PORT:8848}

spring.datasource.url=${SEMIRISK_DB_URL:jdbc:mysql://${semirisk.middleware.host}:3306/semirisk?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SEMIRISK_DB_USERNAME:}
spring.datasource.password=${SEMIRISK_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=5000

spring.flyway.enabled=${SEMIRISK_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

semirisk.data-service.url=${SEMIRISK_DATA_SERVICE_URL:http://localhost:8081}
semirisk.ai.default.model=${SEMIRISK_AI_MODEL:deepseekv4-pro}
semirisk.ai.default.endpoint=${SEMIRISK_AI_ENDPOINT:https://api.deepseek.com/v1}
semirisk.ai.default.api-key=${SEMIRISK_AI_API_KEY:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.pattern.level=%5p [traceId:%X{traceId:-}]
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.db.enabled=${SEMIRISK_HEALTH_DB_ENABLED:false}
management.health.redis.enabled=${SEMIRISK_HEALTH_REDIS_ENABLED:false}
management.endpoints.jmx.exposure.exclude=*

# ── QQ 邮件服务 ──────────────────────────────────────────────────────
semirisk.mail.smtp.host=smtp.qq.com
semirisk.mail.smtp.port=465
semirisk.mail.smtp.username=${SEMIRISK_MAIL_USERNAME:}
semirisk.mail.smtp.password=${SEMIRISK_MAIL_APP_PASSWORD:}
semirisk.mail.from=${SEMIRISK_MAIL_FROM:}
semirisk.mail.ssl-enabled=true

spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${SEMIRISK_MAIL_USERNAME:}
spring.mail.password=${SEMIRISK_MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.default-encoding=UTF-8

# ── Nacos 服务注册发现 ──────────────────────────────────────────────
spring.cloud.nacos.discovery.server-addr=${SEMIRISK_NACOS_HOST:${semirisk.middleware.host}}:8848
spring.cloud.nacos.discovery.namespace=${SEMIRISK_NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${SEMIRISK_NACOS_GROUP:SEMIRISK}
spring.cloud.nacos.discovery.heart-beat-interval=5000
spring.cloud.nacos.discovery.ip=${HOSTNAME:}
spring.cloud.nacos.discovery.register-enabled=true

# ── Nacos 配置中心 ──────────────────────────────────────────────────
spring.cloud.nacos.config.server-addr=${SEMIRISK_NACOS_HOST:${semirisk.middleware.host}}:8848
spring.cloud.nacos.config.namespace=${SEMIRISK_NACOS_NAMESPACE:public}
spring.cloud.nacos.config.group=${SEMIRISK_NACOS_GROUP:SEMIRISK}
spring.cloud.nacos.config.file-extension=properties
spring.config.import=optional:nacos:${spring.application.name}.properties?group=SEMIRISK

# ── Zipkin 分布式链路追踪 ───────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://${semirisk.middleware.host}:9411/api/v2/spans

# ── Sentinel 熔断降级 ────────────────────────────────────────────────
feign.sentinel.enabled=true
spring.cloud.sentinel.transport.dashboard=${SEMIRISK_SENTINEL_DASHBOARD:}
spring.cloud.sentinel.eager=true

# ── Feign 客户端超时与重试 ──────────────────────────────────────────
spring.cloud.openfeign.client.connect-timeout=2000
spring.cloud.openfeign.client.read-timeout=5000
spring.cloud.openfeign.client.config.semirisk-data-service.connect-timeout=2000
spring.cloud.openfeign.client.config.semirisk-data-service.read-timeout=5000
spring.cloud.openfeign.client.config.semirisk-risk-service.connect-timeout=2000
spring.cloud.openfeign.client.config.semirisk-risk-service.read-timeout=5000
spring.cloud.openfeign.client.config.semirisk-ai-service.connect-timeout=2000
spring.cloud.openfeign.client.config.semirisk-ai-service.read-timeout=10000
spring.cloud.openfeign.client.retryer=com.semirisk.config.FeignClientRetryer

spring.cloud.compatibility-verifier.enabled=false

# ── Nacos 日志：禁用内置 logback 配置，避免 appender 冲突 ─────────────
nacos.logging.default.config.enabled=false

# ── Phase 3: Embedding / Vector 配置（可选，留空则禁用向量检索） ──────
semirisk.embedding.endpoint=${SEMIRISK_EMBEDDING_ENDPOINT:}
semirisk.embedding.api-key=${SEMIRISK_EMBEDDING_API_KEY:}
