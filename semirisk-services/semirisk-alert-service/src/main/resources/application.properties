spring.application.name=semirisk-alert-service
server.port=${SEMIRISK_ALERT_PORT:8084}
semirisk.middleware.host=${SEMIRISK_MIDDLEWARE_HOST:192.168.101.128}
spring.datasource.url=${SEMIRISK_DB_URL:jdbc:mysql://${semirisk.middleware.host}:3306/semirisk?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SEMIRISK_DB_USERNAME:semirisk}
spring.datasource.password=${SEMIRISK_DB_PASSWORD:semirisk}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=0
management.endpoints.web.exposure.include=health,info,metrics
