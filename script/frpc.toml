# frp 客户端配置（安装在 VM 192.168.101.130 上）

# 连接 frp 服务端（云服务器）
server_addr = 123.57.239.56
server_port = 7000

# 认证 token（与服务端一致）
authentication_method = token
token = semirisk-frp-token-2025

# 客户端名称
webhook_name = semirisk-vm

# 日志配置
log_file = /var/log/frpc.log
log_level = info
log_max_days = 7

# ============================================
# TCP 端口映射：将 VM 上的端口转发到云服务器
# ============================================

# 前端 HTTP（VM 80 → 云服务器 8081）
[semirisk-http]
type = tcp
local_ip = 127.0.0.1
local_port = 80
remote_port = 8081

# API Gateway（VM 8080 → 云服务器 8080）
[semirisk-api]
type = tcp
local_ip = 127.0.0.1
local_port = 8080
remote_port = 8080

# Nacos 控制台（VM 8848 → 云服务器 8848，仅限内网管理）
[semirisk-nacos]
type = tcp
local_ip = 127.0.0.1
local_port = 8848
remote_port = 8848

# MinIO 控制台（VM 9001 → 云服务器 9001，仅限内网管理）
[semirisk-minio]
type = tcp
local_ip = 127.0.0.1
local_port = 9001
remote_port = 9001

# Zipkin（VM 9411 → 云服务器 9411，仅限内网管理）
[semirisk-zipkin]
type = tcp
local_ip = 127.0.0.1
local_port = 9411
remote_port = 9411

# RabbitMQ 管理界面（VM 15672 → 云服务器 15672，仅限内网管理）
[semirisk-rabbitmq]
type = tcp
local_ip = 127.0.0.1
local_port = 15672
remote_port = 15672
